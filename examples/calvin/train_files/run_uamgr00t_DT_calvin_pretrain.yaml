# Seer-aligned pretrain config for UamGR00T_DT on CALVIN play data.
#
# Matches Seer's pretraining setting:
#   sequence_length = 14  (history_frames = 14)
#   future_steps    = 3   (future_offset = 3, per CalvinDT_K14DataConfig)
#   action chunk    = 3   (action_horizon = 3)
#   data            = CALVIN unlabeled play data (task_ABC_D_play_lerobot)
#
# Pretrain goal: learn visual representations via future frame reconstruction.
# loss_scale.vla is set to 0 to skip action loss — focus solely on future
# branch. Set vla: 1.0 (or use finetune config) when switching to action
# supervised training.
#
# Expected dataset path: datasets/task_ABC_D_play_lerobot
# This is the CALVIN ABCD play split without language annotations.
# Language field will return empty string; tokenizer handles it gracefully.
run_id: uamvla_gr00t_dt_calvin_pretrain
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: tancilon1-fudan-university-school-of-management
wandb_project: uamvla
is_debug: false
version_id: "0.21"

framework:
  name: UamGR00T_DT

  obs_image_size: [224, 224]
  qwen_image_size: 224

  # K=14 history frames (Seer pretrain sequence_length=14).
  history_frames: 14
  history_encoder:
    num_latents: 10
    resampler_depth: 3
    freeze_qwen_vit: true

  exec_horizon: 1

  # DT does not use the LT-style aux_heads; empty dict avoids KeyError in
  # _maybe_build_aux_heads() inherited from UamVLAOFT.
  aux_heads: {}

  future_branch:
    num_obs_tokens: 49
    num_cross_attn_layers: 2
    num_heads: 8
    future_weight: 1.0          # upweight future recon during pretrain
    z_channel: 512
    dit_embed_dim: 512
    dit_depth: 3
    dit_timesteps: "1000"

  qwenvl:
    base_vlm: ./ckpt/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    enable_gradient_checkpointing: true

  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 3
    future_action_window_size: 2
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      positional_embeddings: null

  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets

    data_root_dir: datasets
    # CALVIN play data (no language labels), K=14 history + future_rgb at t+3.
    # Dataset name must match the directory under data_root_dir.
    data_mix: calvin_play_dt_k14   # → datasets/task_ABC_D_play_lerobot

    include_state: true
    gr00t_state_indices: [0, 1, 2, 3, 4, 5, 7]

    obs:
      - video.primary_image
      - video.wrist_image

    state_key: state
    action_key: action

    state_dim: 8
    full_state_dim: 8
    robot_state_dim: 8
    action_dim: 7
    action_horizon: 3

    action_type: delta_qpos

    # DT multi-frame signals: K-1=13 history + future at t+3.
    num_history_frames: 13      # = history_frames - 1
    future_offset: 3

    # LeRobot v3.0 dataset (task_ABC_D_play_lerobot was created by LeRobot v3 API)
    lerobot_version: "v3.0"

    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."

    per_device_batch_size: 4    # H200 140 GB: batch=4 → eff_batch=128, 20ep≈280k steps
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 280476       # Seer-aligned: 20 epochs @ eff_batch=128 (H200 8x, batch_per_gpu=4, grad_accum=4)
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 100

  learning_rate:
    base: 2.5e-05               # remaining params (embedding layers, etc.)
    qwen_vl_interface: 1.0e-05  # pretrained backbone → small LR
    future_branch: 1.0e-04           # randomly initialised new head → higher LR
    history_encoder.resampler: 1.0e-04  # only the new PerceiverResampler params;
                                        # history_encoder._visual shares weights with
                                        # qwen_vl_interface → using "history_encoder"
                                        # directly causes duplicate param group error
    # action_model omitted: frozen during pretrain (see freeze_modules below)

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06

  # Freeze the action model during pretrain; its DiT weights are uninitialised
  # noise relative to the future-reconstruction objective. train_starvla.py's
  # build_param_lr_groups() honours this field and excludes these params from
  # the optimizer, saving ~157 M × 12 bytes of optimizer state.
  # NOTE: loss_scale.vla has no effect in the current trainer (train_starvla.py
  # does not apply loss_scale multipliers); freezing is the correct mechanism.
  freeze_modules: "action_model"

  loss_scale:
    # NOTE: loss_scale.{vla,vlm} are NOT applied by train_starvla.py's
    # _train_step — they are dead config in the current trainer.
    # Freezing action_model above is what actually excludes action gradients.
    vla: 0.0
    vlm: 0.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
