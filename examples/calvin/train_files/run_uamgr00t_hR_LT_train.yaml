run_id: uamvla_gr00t_hR_LT_calvin_d
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: tancilon1-fudan-university-school-of-management
wandb_project: uamvla
is_debug: false
version_id: "0.21"

framework:
  name: UamGR00T_hR_LT

  obs_image_size: [224, 224]
  qwen_image_size: 224

  qwenvl:
    base_vlm: ./ckpt/Qwen3-VL-4B-Instruct
    # flash_attention_2 is safe: UamGR00T_hR_LT uses standard causal mask
    # (no 4-D parallel block mask like UamGR00T_hR_A).
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    enable_gradient_checkpointing: true

  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      positional_embeddings: null

  reduce_in_full_precision: true

  vae:
    path: ckpt/pretrained_vae

  aux_loss_control:
    enabled: true
    aux_budget: 1.0

  aux_heads:
    # ── Recon (ReconHead) ────────────────────────────────────────────────
    recon:
      enabled: true
      loss_weight: 1.0

    # ── Depth (LatentDepthHead — Video-Depth-Anything V2 style) ─────────
    # Requires precomputed sidecar:
    #   python runners/preprocess_depth_latent.py --dataset_root <sidecar_root>
    # depth_px_size is auto-derived from obs_image_size (224 → 112); do NOT set here.
    depth:
      enabled: true
      latent_channels: 64       # must match preprocess_depth_latent.py --latent_channels
      head_kind: pointwise_mlp  # or "linear" for a lighter probe-only baseline
      probe_enabled: true       # detached linear probe; reports probe_r2_pixel, no backbone grad
      loss_weight: 1.0
      visualize: false          # set true to decode depth latents via VAE in visualize_batch
                                # ZeRO-2 only (VAE params not gathered during training forward)

    # ── Affordance (AffordanceTokenHead — Splat-MOVER style) ────────────
    # Requires precomputed sidecar:
    #   python runners/preprocess_affordance_px.py --dataset_root <sidecar_root>
    # afford_px_size is auto-derived from obs_image_size (224 → 112); do NOT set here.
    affordance:
      enabled: true
      camera: "image"           # must match --camera arg used in preprocess_affordance_px.py
      head_kind: pointwise_mlp
      loss_weight: 1.0

    # ── Action-Conditioned Future (ActionConditionedFutureHead — SEER style) ──
    # Predicts the next frame conditioned on the current visual context + action chunk.
    # Step 1 of SEER: forward model  (o_t, a_t) → ô_{t+1}
    action_conditioned_future:
      enabled: true
      action_encoder_layers: 2
      action_embed_dim: 512
      action_encoder_heads: 8
      action_dropout: 0.1
      film_hidden_dim: 512
      denoiser_depth: 3
      denoiser_embed_dim: 1024
      repeat_factor: 1
      gen_timesteps: "1000"
      loss_weight: 1.0
      visualize: false

    # ── Unused heads (kept as explicit false for clarity) ────────────────
    pose:
      enabled: false
    future:
      enabled: false
    grounding:
      enabled: false

datasets:
  vla_data:
    dataset_py: lerobot_datasets

    data_root_dir: datasets
    data_mix: calvin_d_scene_mix_starvla_uam_state_h8

    include_state: true
    gr00t_state_indices: [0, 1, 2, 3, 4, 5, 7]

    obs:
      - video.primary_image
      - video.wrist_image

    state_key: state
    action_key: action

    state_dim: 26
    full_state_dim: 26
    robot_state_dim: 8
    action_dim: 7
    action_horizon: 8

    state_layout:
      robot_state: [0, 8]
      target_pose_rot6d: [8, 14]
      target_pose_trans: [14, 17]
      static_cam_rot6d: [17, 23]
      static_cam_trans: [23, 26]

    aux_state_slice:
      target_pose_rot6d: [8, 14]
      target_pose_trans: [14, 17]
      static_cam_rot6d: [17, 23]
      static_cam_trans: [23, 26]

    action_type: delta_qpos

    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."

    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchvision_av

    # Sidecar I/O required by LatentDepthHead and AffordanceTokenHead.
    # The dataloader will load depth_latent / depth_px / affordance_px keys.
    enable_sidecar_io: true
    strict_sidecar_io: false
    image_target_cache_maxsize: 256

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100

  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06

  freeze_modules: ""

  loss_scale:
    vla: 1.0
    vlm: 0.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
