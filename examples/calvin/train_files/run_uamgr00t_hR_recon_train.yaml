run_id: uamvla_gr00t_hR_starvla26_calvin_d
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: tancilon1-fudan-university-school-of-management
wandb_project: uamvla
is_debug: false
version_id: "0.21"

framework:
  name: UamGR00T_hR   # dedicated h_R recon tokens (ReconVLA §3.2)

  obs_image_size: [224, 224]
  qwen_image_size: 224

  qwenvl:
    base_vlm: ./ckpt/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    enable_gradient_checkpointing: true

  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      positional_embeddings: null

  reduce_in_full_precision: true

  aux_loss_control:
    enabled: true
    aux_budget: 1.0
  vae:
    path: ckpt/pretrained_vae
  aux_heads:
    pose:
      enabled: false
    future:
      enabled: false
    recon:
      enabled: true
      recon_token: "🎯"   # single-token placeholder for h_R positions
    depth:
      enabled: false
    grounding:
      enabled: false
    affordance:
      enabled: false
    action_conditioned_future:
      enabled: false

datasets:
  vla_data:
    dataset_py: lerobot_datasets

    data_root_dir: datasets
    data_mix: calvin_d_scene_mix_starvla_uam_state_h8

    include_state: true
    gr00t_state_indices: [0, 1, 2, 3, 4, 5, 7]

    obs:
      - video.primary_image
      - video.wrist_image

    state_key: state
    action_key: action

    state_dim: 26
    full_state_dim: 26
    robot_state_dim: 8
    action_dim: 7
    action_horizon: 8

    state_layout:
      robot_state: [0, 8]
      target_pose_rot6d: [8, 14]
      target_pose_trans: [14, 17]
      static_cam_rot6d: [17, 23]
      static_cam_trans: [23, 26]

    aux_state_slice:
      target_pose_rot6d: [8, 14]
      target_pose_trans: [14, 17]
      static_cam_rot6d: [17, 23]
      static_cam_trans: [23, 26]

    action_type: delta_qpos

    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."

    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchvision_av

    enable_sidecar_io: true        # required: recon head reads image_targets/ sidecars
    strict_sidecar_io: false
    image_target_cache_maxsize: 256

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100

  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06

  freeze_modules: ""

  loss_scale:
    vla: 1.0
    vlm: 0.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
