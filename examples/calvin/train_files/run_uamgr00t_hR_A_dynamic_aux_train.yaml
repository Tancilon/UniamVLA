run_id: uamvla_gr00t_hR_A_calvin_d_dynamic_aux
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: tancilon1-fudan-university-school-of-management
wandb_project: uamvla
is_debug: false
version_id: "0.21"

framework:
  name: UamGR00T_hR_A

  obs_image_size: [224, 224]
  qwen_image_size: 224

  qwenvl:
    base_vlm: ./ckpt/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    enable_gradient_checkpointing: true

  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      positional_embeddings: null

  reduce_in_full_precision: true

  aux_loss_control:
    enabled: true
    aux_budget: 1.0

  vae:
    path: ckpt/pretrained_vae

  aux_heads:
    pose:
      enabled: false
    future:
      enabled: false
    recon:
      enabled: true
    depth:
      enabled: true
    grounding:
      enabled: false
    affordance:
      enabled: false
    action_conditioned_future:
      enabled: false

  # ── Dynamic aux head weight scheduling ───────────────────────────────
  # Two-level strategy:
  #   Layer 1 (global annealing): all aux weights follow a cosine decay
  #     schedule from 1.0 → 0.0 over the training run, so the final
  #     N% of training is dominated entirely by the action loss.
  #   Layer 2 (EMA balancing): between aux heads, contribution is kept
  #     close to target_ratios using EMA-tracked raw loss normalization.
  #
  # Timeline with default settings (total_steps=100000):
  #   step    0 –  5 000 : warmup, aux weight linearly 0 → 1
  #   step 5000 – 60 000 : plateau at 1.0, EMA balancing active
  #   step 60000 – 100000: cosine decay 1.0 → 0.0
  #   step 100000        : aux weight = 0, pure action loss
  dynamic_aux:
    total_steps: 100000          # must match trainer.max_train_steps

    # Warmup: aux weights ramp from 0 → 1 over the first N steps.
    # Gives the model time to stabilize before aux gradients kick in.
    warmup_steps: 5000

    # Plateau ends here; cosine annealing begins (fraction of total_steps).
    annealing_start_ratio: 0.6   # start annealing at step 60 000

    # Annealing finishes here; aux weights reach min_weight_floor.
    annealing_end_ratio: 1.0     # fully faded out by end of training

    # Set to 0.0 so aux heads completely disappear at end of training.
    # Set to e.g. 0.05 if you want a small residual signal throughout.
    min_weight_floor: 0.0

    # EMA-based relative balancing between different aux heads.
    enable_ema_balancing: true
    ema_momentum: 0.99
    # EMA needs this many steps to warm up before balancing adjustments
    # take effect (prevents overreaction to noisy early-training loss).
    balance_warmup_steps: 2000

    # Max multiplier applied to any single head's weight for balancing.
    # Prevents unstable spikes when one head's loss collapses quickly.
    max_weight_cap: 4.0

    # Static base weight for each enabled head.
    # depth is boosted to compensate its naturally smaller raw loss
    # magnitude (~10x smaller than recon in raw MSE terms).
    base_weights:
      recon: 0.1
      depth: 1.0   # compensates depth_raw ≈ 0.001–0.007 vs recon_raw ≈ 0.08–0.15

    # Desired contribution ratio for each head within aux_total.
    # Adjust to reflect how much representation signal you want from each.
    target_ratios:
      recon: 0.6
      depth: 0.4

datasets:
  vla_data:
    dataset_py: lerobot_datasets

    data_root_dir: datasets
    data_mix: calvin_d_scene_mix_starvla_uam_state_h8

    include_state: true
    gr00t_state_indices: [0, 1, 2, 3, 4, 5, 7]

    obs:
      - video.primary_image
      - video.wrist_image

    state_key: state
    action_key: action

    state_dim: 26
    full_state_dim: 26
    robot_state_dim: 8
    action_dim: 7
    action_horizon: 8

    state_layout:
      robot_state: [0, 8]
      target_pose_rot6d: [8, 14]
      target_pose_trans: [14, 17]
      static_cam_rot6d: [17, 23]
      static_cam_trans: [23, 26]

    aux_state_slice:
      target_pose_rot6d: [8, 14]
      target_pose_trans: [14, 17]
      static_cam_rot6d: [17, 23]
      static_cam_trans: [23, 26]

    action_type: delta_qpos

    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."

    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchvision_av

    enable_sidecar_io: false
    strict_sidecar_io: false
    image_target_cache_maxsize: 256

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100

  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06

  freeze_modules: ""

  loss_scale:
    vla: 1.0
    vlm: 0.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
