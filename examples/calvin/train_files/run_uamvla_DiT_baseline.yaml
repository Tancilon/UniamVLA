run_id: uamvla_dit_baseline
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: tancilon1-fudan-university-school-of-management
wandb_project: uamvla
is_debug: false

framework:
  name: UamVLA_DiT
  obs_image_size: [224, 224]
  qwen_image_size: 256
  qwenvl:
    base_vlm: ./ckpt/RynnBrain-CoP-8B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 4096
    enable_gradient_checkpointing: true
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 768
    action_dim: 7
    action_horizon: 8
    num_inference_timesteps: 10
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: datasets
    data_mix: calvin_abc_dit
    include_state: false
    obs: [video.primary_image, video.wrist_image]
    action_key: action
    action_dim: 7
    action_horizon: 8
    action_type: delta_qpos
    num_history_frames: 0
    history_interval: 5
    future_offset: 0
    image_resize: 224
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 4
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  pretrained_checkpoint: null
  is_resume: false
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 5.0e-06
    action_model: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
