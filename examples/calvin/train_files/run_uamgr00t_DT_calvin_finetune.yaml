# Seer-aligned finetune config for UamGR00T_DT on CALVIN ABC.
#
# K=14 full-architecture finetune setting:
#   history frames  = 14  (kept identical to the pretrained model)
#   future_steps    = 3   (future_offset = 3, per CalvinDT_K14DataConfig)
#   action chunk    = 3   (action_horizon = 3)
#   exec horizon    = 1   (predict 3 steps, execute only 1 before re-query)
#   dual camera     = primary_image + wrist_image
#
# Prerequisite: run pretrain config first, then load pretrained checkpoint
# through trainer.pretrained_checkpoint.
run_id: uamvla_gr00t_dt_calvin_abc_finetune
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: tancilon1-fudan-university-school-of-management
wandb_project: uamvla
is_debug: false
version_id: "0.21"

framework:
  name: UamGR00T_DT

  obs_image_size: [224, 224]
  qwen_image_size: 224

  # Keep the complete temporal architecture identical to pretraining.
  # HistoryVisionEncoder encodes the K-1=13 past frames.
  history_frames: 14
  history_encoder:
    num_latents: 16
    resampler_depth: 3
    freeze_qwen_vit: true

  # exec_horizon=1: predict 3-step chunk but return only 1 step per query
  # to match Seer's inference behavior (re-query at every step).
  exec_horizon: 1

  aux_heads: {}

  future_branch:
    num_obs_tokens: 49          # 7x7 spatial grid per view
    num_cross_attn_layers: 2
    num_heads: 16
    future_weight: 1.0
    z_channel: 1024
    dit_embed_dim: 1024
    dit_depth: 3
    dit_timesteps: "1000"

  qwenvl:
    base_vlm: ./ckpt/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    enable_gradient_checkpointing: true

  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 3           # Seer action_pred_steps=3
    future_action_window_size: 2
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      positional_embeddings: null

  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets

    data_root_dir: datasets
    # Calvin ABC language data with K=14 history + future_rgb at t+3.
    data_mix: calvin_abc_dt_k14

    include_state: true
    gr00t_state_indices: [0, 1, 2, 3, 4, 5, 7]

    obs:
      - video.primary_image
      - video.wrist_image

    state_key: state
    action_key: action

    state_dim: 8
    full_state_dim: 8
    robot_state_dim: 8
    action_dim: 7
    action_horizon: 3

    action_type: delta_qpos

    # DT multi-frame signals read by _pack_sample:
    # num_history_frames controls how many past frames to extract from the
    # combined delta_indices window; future_offset marks the future target.
    num_history_frames: 13      # = history_frames - 1 = K-1
    future_offset: 3            # t+3 frame → future_rgb

    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."

    per_device_batch_size: 4
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  # Load model weights only and start a new finetuning run from step 0.
  pretrained_checkpoint: /inspire/hdd/global_user/heyu-240108120071/dengqi/UniamVLA/playground/Checkpoints/uamvla_gr00t_dt_calvin_pretrain/final_model/pytorch_model.pt
  is_resume: false

  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100

  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06

  freeze_modules: ""

  loss_scale:
    vla: 1.0        # action + future reconstruction
    vlm: 0.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
