# UamGR00T_DT finetune config for CALVIN ABC.
#
# Architecture:
#   - K=10 history frames fed to Qwen3-VL (oldest→newest)
#   - State tokens injected before each frame's vision_start (Option A hook)
#   - PerceiverResampler compresses each view's 49 ViT tokens → 16 tokens
#     before entering Qwen LLM
#   - A zero-initialized learnable frame embedding is shared by each frame's
#     state token and compressed visual tokens across both camera views
#   - 49×2=98 learnable future_query_tokens appended at Qwen sequence end
#   - Qwen full hidden → GR00T FlowmatchingActionHead (action prediction)
#   - future_hidden (last 98 positions) → FutureDiTBranch × 2 views
#     (flow matching conditioned on future_query hidden, supervised by
#      frozen Qwen ViT GT tokens + pixel decoder)
#
# No SeerJointDecoder.  Simpler than DT; action model reused from GR00T family.
run_id: uamvla_gr00t_dt_calvin_abc_finetune_resample_visual
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: tancilon1-fudan-university-school-of-management
wandb_project: uamvla
is_debug: false
version_id: "0.1"

framework:
  name: UamGR00T_DT

  obs_image_size: [224, 224]
  qwen_image_size: 224

  # K history frames (K-1 history + 1 current)
  history_frames: 10

  # State dimension used by state_proj_to_llm (Option A state injection)
  state_dim: 7

  use_temporal_markers: false

  # Future branch: future_query_tokens + FutureDiTBranch
  future_branch:
    future_tokens_per_view: 49      # learnable tokens per camera view
    image_size: 224                 # expected pixel decoder output size
    dit_num_img_tokens: 49          # GT image tokens per view (Qwen ViT output)
    dit_hidden_dim: 512             # FutureDiT internal width
    dit_depth: 2                    # FutureDiT blocks
    dit_num_heads: 8
    dit_num_inference_steps: 4      # Euler steps at inference
    token_loss_weight: 0.5          # flow matching velocity MSE weight
    pixel_loss_weight: 0.5          # pixel reconstruction MSE weight

  # PerceiverResampler: compress Qwen ViT tokens before entering Qwen LLM.
  # 49 tokens/view → 16 tokens/view.
  # With K=10 frames × 2 views: 10×2×49=980 → 10×2×16=320 visual tokens.
  visual_resampler:
    enabled: true
    num_orig_tokens: 49             # ViT output tokens per view (7×7)
    num_compressed_tokens: 16       # compressed tokens per view
    depth: 3                        # PerceiverAttention + FFN blocks
    heads: 8                        # attention heads
    dim_head: 64                    # head dimension

  # GR00T action model (same as standard UamGR00T family)
  # Robot state is encoded only by Qwen; the direct action-head state path is disabled.
  qwenvl:
    base_vlm: ./ckpt/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560
    enable_gradient_checkpointing: true

  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 0
    action_horizon: 8
    future_action_window_size: 8
    past_action_window_size: 0
    repeated_diffusion_steps: 4
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

  aux_heads: {}
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets

    data_root_dir: datasets
    data_mix: calvin_abc_dt_k10_h8

    include_state: true
    gr00t_state_indices: [0, 1, 2, 3, 4, 5, 7]

    obs:
      - video.primary_image
      - video.wrist_image

    state_key: state
    action_key: action

    state_dim: 8
    full_state_dim: 8
    robot_state_dim: 8
    action_dim: 7
    action_horizon: 8

    action_type: delta_qpos

    num_history_frames: 9       # K-1
    future_offset: 8            # t+8 frame → future_rgb (= action_chunk steps ahead)

    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."

    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  pretrained_checkpoint: null
  is_resume: false

  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 2000

  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    future_branch: 1.0e-04         # future_query_tokens + future_dit_branches
    visual_resampler: 1.0e-04      # PerceiverResampler
    temporal_frame_embedding: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06

  freeze_modules: "qwen_vl_interface.model.model.visual"

  loss_scale:
    vla: 1.0
    vlm: 0.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  visualization:
    enabled: true
    train_every_n_steps: 2000
    num_samples: 1
