run_id: uamvla_oft_starvla26_calvin_d
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: "0.21"

framework:
  name: UamVLAOFTStarVLA26

  qwen_image_size: 640
  obs_image_size: 640

  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen2.5-VL-3B-Instruct-Action
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048

  dino:
    dino_backbone: dinov2_vits14

  action_model:
    action_model_type: MLP
    action_dim: 7
    action_horizon: 8
    future_action_window_size: 8
    past_action_window_size: 0
    action_hidden_dim: 2048

  reduce_in_full_precision: true

  state_layout:
    robot_state: [0, 8]
    target_pose_rot6d: [8, 14]
    target_pose_trans: [14, 17]
    static_cam_rot6d: [17, 23]
    static_cam_trans: [23, 26]

  aux_heads:
    pose:
      enabled: false
    future:
      enabled: false
    recon:
      enabled: false
    depth:
      enabled: false
    grounding:
      enabled: false
    affordance:
      enabled: false
    action_conditioned_future:
      enabled: false

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets

    data_root_dir: datasets/calvin2uam
    data_mix: uamvla_calvin_d_h8

    include_state: true
    lerobot_version: v3.0

    obs:
      - video.primary_image
      - video.wrist_image

    state_key: state
    action_key: action

    state_dim: 26
    full_state_dim: 26
    robot_state_dim: 8
    action_dim: 7
    action_horizon: 8

    state_layout:
      robot_state: [0, 8]
      target_pose_rot6d: [8, 14]
      target_pose_trans: [14, 17]
      static_cam_rot6d: [17, 23]
      static_cam_trans: [23, 26]

    aux_state_slice:
      target_pose_rot6d: [8, 14]
      target_pose_trans: [14, 17]
      static_cam_rot6d: [17, 23]
      static_cam_trans: [23, 26]

    action_mode: abs
    action_type: delta_qpos

    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."

    per_device_batch_size: 1
    load_all_data_for_training: true
    video_backend: torchvision_av
    image_resize: 640
    num_workers: 4

    enable_sidecar_io: false
    strict_sidecar_io: false
    image_target_cache_maxsize: 256

trainer:
  max_train_steps: 30000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100

  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06

  freeze_modules: ""

  loss_scale:
    vla: 1.0
    vlm: 0.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
