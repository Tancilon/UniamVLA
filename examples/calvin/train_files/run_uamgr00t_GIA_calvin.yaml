# Calvin ABC training config for UamGR00T_GIA.
#
# Three auxiliary heads (geometry + interaction + temporal) with dedicated
# emoji token blocks, causal hierarchy: depth(✨) → affordance(🟩) → future(🟧).
#
# Sidecar prerequisites (per scene A/B/C):
#   python runners/preprocess_depth_vda.py       --dataset_root datasets/task_ABC_D_scene_<SCENE>_lerobot
#   python runners/preprocess_depth_latent.py    --dataset_root datasets/task_ABC_D_scene_<SCENE>_lerobot
#   python runners/preprocess_affordance_vrb.py  --dataset_root datasets/task_ABC_D_scene_<SCENE>_lerobot
#   python runners/preprocess_affordance_px.py   --dataset_root datasets/task_ABC_D_scene_<SCENE>_lerobot
#   python runners/preprocess_rgb_latent.py      --dataset_root datasets/task_ABC_D_scene_<SCENE>_lerobot
run_id: uamvla_gr00t_gia_calvin_abc
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: tancilon1-fudan-university-school-of-management
wandb_project: uamvla
is_debug: false
version_id: "0.1"

framework:
  name: UamGR00T_GIA

  obs_image_size: [224, 224]
  qwen_image_size: 256   # Qwen3.5 processor always outputs 8×8=64 tokens/view regardless of pixel budget

  qwenvl:
    base_vlm: ./ckpt/Qwen3.5-4B
    attn_implementation: flash_attention_2   # Strategy B uses standard causal mask
    vl_hidden_dim: 2048
    enable_gradient_checkpointing: true

  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

  # Frozen VAE for depth_latent / future_latent encoding.
  vae:
    path: ckpt/pretrained_vae

  aux_loss_control:
    enabled: true
    aux_budget: 1.0    # scales sum(aux_losses) relative to action_loss

  # GIA three heads: depth(✨) → affordance(🟩) → future(🟧)
  aux_heads:
    depth:
      enabled: true
      loss_weight: 0.5
      latent_channels: 64
      head_kind: pointwise_mlp
      probe_enabled: true
      camera: image
      visualize: false
    affordance:
      enabled: true
      loss_weight: 0.5
      head_kind: pointwise_mlp
      camera: image
    future:
      enabled: true
      loss_weight: 0.5
      latent_channels: 64
      head_kind: pointwise_mlp
      future_offset: 8   # = action_horizon; one full chunk ahead
      camera: image
      visualize: false

  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets

    data_root_dir: datasets
    data_mix: calvin_abc_lt_starvla_uam_state_h8

    enable_sidecar_io: true
    strict_sidecar_io: false
    image_target_cache_maxsize: 256

    include_state: true
    gr00t_state_indices: [0, 1, 2, 3, 4, 5, 7]

    obs:
      - video.primary_image
      - video.wrist_image

    state_key: state
    action_key: action

    state_dim: 8
    full_state_dim: 8
    robot_state_dim: 8
    action_dim: 7
    action_horizon: 8

    action_type: delta_qpos

    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100

  learning_rate:
    base: 2.5e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6

  freeze_modules: ""

  loss_scale:
    vla: 1.0
    vlm: 0.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
