run_id: uamvla_oft_calvin_abcd
run_root_dir: playground/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_project: uamvla
wandb_entity: tancilon1-fudan-university-school-of-management
is_debug: false
version_id: "0.1"

# ───────────────────────────────────────────────────────
# framework: model construction
# ───────────────────────────────────────────────────────
framework:
  name: UamVLAOFT
  qwenvl:
    base_vlm: ckpt/Qwen3-VL-8B-Instruct
    attn_implementation: flash_attention_2
  action_model:
    action_model_type: MLP
    action_dim: 7
    action_hidden_dim: 4096            # overridden at runtime to qwen hidden_size
    action_horizon: 5
    future_action_window_size: 4        # action_horizon = future + 1 = 5
    past_action_window_size: 0
  obs_image_size: [640, 640]
  # Shared frozen VAE for future + recon heads (diffusers AutoencoderKL).
  vae:
    path: ckpt/pretrained_vae
  # OOM triage mode: keep action + recon on; disable pose/future aux heads.
  # ``lr`` is the per-head LR consumed by the optimizer grouping logic;
  # non-LR keys are forwarded to the head's ``__init__``.
  aux_heads:
    pose:
      enabled: false
      loss_weight: 0.5
      pose_mode: rot_matrix
      sde_mode: ve
      num_queries: 4
      semantic_dim: 512
      sampling_steps: 500
    future:
      enabled: false
      loss_weight: 1.0
      view_idx: 0
      target_resize: 320
      denoiser_depth: 3
      denoiser_embed_dim: 1024
      repeat_factor: 4
    recon:
      enabled: true
      loss_weight: 1.0
      view_idx: 0
      target_resize: 320
      denoiser_depth: 3
      denoiser_embed_dim: 1024
      repeat_factor: 4

# ───────────────────────────────────────────────────────
# datasets: data loader plugin selection
# ───────────────────────────────────────────────────────
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: datasets/calvin2uam
    data_mix: uamvla_calvin_abcd        # registered in examples/calvin/train_files/data_registry/data_config.py
    action_type: delta_qpos
    per_device_batch_size: 1       # 4→2→1: lm_head fwd OOMs on 80GB H100 even under ZeRO-3 at batch=2; drop to 1, compensate via GRAD_ACCUM=8
    obs: ["video.primary_image", "video.wrist_image"]
    include_state: true       # _pack_sample gates the state column on this; UamVLAOFT needs the (T=1, 33) concatenated state for aux_state_slice
    image_resize: 640         # _pack_sample resizes video frames to this size; UamVLAOFT needs 640 for Qwen3-VL ppv=400. Saves the prior 200→224→640 double resize (codex I-5).
    aux_state_slice:
      target_pose_rot6d: [15, 21]
      target_pose_trans: [21, 24]
      static_cam_rot6d:  [24, 30]
      static_cam_trans:  [30, 33]

# ───────────────────────────────────────────────────────
# trainer: optimization / logging
# ───────────────────────────────────────────────────────
trainer:
  epochs: 10
  max_train_steps: 200000    # ~5.4 epochs of CALVIN ABCD_D (1.19M frames) at effective batch 32
  num_warmup_steps: 2000     # 1% of total steps; standard cos schedule warmup
  save_interval: 10000       # 20 ckpts over the run; 5K was too frequent
  eval_interval: 1000        # 200 evals; 100 was too frequent and would slow training
  visualization:
    enabled: true
    train_every_n_steps: 1000
    num_samples: 1

  learning_rate:
    base:               1.0e-4         # fallback for unmatched groups (incl. aux_heads.{pose,future,recon}.*)
    qwen_vl_interface:  1.0e-5         # backbone
    action_model:       1.0e-4         # MLP L1 regression head
    # NOTE: state_encoder removed in spec §2.2 cleanup; model has no such attribute.
    # NOTE: aux_heads.{pose,future,recon} fall into the `base` group by default;
    #   `build_param_lr_groups` reads `cfg.trainer.learning_rate.<attr>` and does
    #   `getattr(model, attr)` — there's no per-head lr knob here.

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6

  freeze_modules: null
  max_grad_norm: 1.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
