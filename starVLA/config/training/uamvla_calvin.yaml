run_id: uamvla_calvin_phase1
run_root_dir: playground/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_project: uamvla
wandb_entity: tancilon
is_debug: false
version_id: "0.1"

# ───────────────────────────────────────────────────────
# framework: model construction
# ───────────────────────────────────────────────────────
framework:
  name: UamVLA
  embodiment:
    name: franka_calvin
    action_dim: 7
  qwenvl:
    base_vlm: ckpt/Qwen3-VL-8B-Instruct
    attn_implementation: flash_attention_2
  action_model:
    future_action_window_size: 7        # = action_horizon - 1; starVLA convention (read by ModelClient)
    num_bins: 256                        # ActionTokenizer bin count
    action_dim: 7
  state_encoder:
    type: modular
    register_special_tokens: true
    normalization:
      mode: q99                # one of: q99 | mean_std | min_max | none
      apply_to:                # canonical field paths to normalize
        - arm_0.ee_pose
        - arm_0.joint_pos
        - gripper_0
  vae:
    path: ckpt/pretrained_vae
  aux_heads:
    action:
      enabled: true
      loss_weight: 1.0
      lr: 1.0e-4
    pose:
      enabled: true
      loss_weight: 0.5
      lr: 1.0e-4
      pose_mode: rot_matrix
      sde_mode: ve
      num_queries: 4
      semantic_dim: 512
      sampling_steps: 500
      # Static-camera intrinsic for PoseHead.visualize. Resolved relative to
      # PWD at training launch (= repo root). Points at the per-subdir
      # statistics.yaml the preprocessor writes alongside the data shards.
      # Override via CLI when pointing the run at a different preprocessed
      # dataset, e.g.:
      #   --framework.aux_heads.pose.stats_path datasets/uamvla_calvin/<subdir>/statistics.yaml
      stats_path: datasets/uamvla_calvin/task_D_D_partial/statistics.yaml
    future:
      enabled: true
      loss_weight: 0.1
      lr: 1.0e-4
      view_idx: 0
      target_resize: 320                 # ppv=400 → 20*16
      denoiser_depth: 3
      denoiser_embed_dim: 1024
      repeat_factor: 4
    recon:
      enabled: true
      loss_weight: 0.1
      lr: 1.0e-4
      view_idx: 0
      target_resize: 320
      denoiser_depth: 3
      denoiser_embed_dim: 1024
      repeat_factor: 4

# ───────────────────────────────────────────────────────
# datasets: data loader plugin selection
# ───────────────────────────────────────────────────────
datasets:
  vla_data:
    dataset_py: uamvla_dataset           # starVLA/dataloader/uamvla_dataset.py
    data_root_dir: datasets/uamvla_calvin
    data_mix: calvin_uamvla
    image_size: 640                       # Qwen3-VL ppv=400 ⇒ 640x640 (UamVLA path: currently unused — see spec §5.3)
    per_device_batch_size: 2              # 8B backbone is tighter than 4B (starvla_cotrain_libero.yaml uses 16)
    delete_pause_frame: false

# ───────────────────────────────────────────────────────
# trainer: optimization / logging
# ───────────────────────────────────────────────────────
trainer:
  epochs: 50
  max_train_steps: 100000
  num_warmup_steps: 500
  save_interval: 2000
  eval_interval: 5000

  learning_rate:
    base:                  1.0e-4         # fallback for unmatched param groups
    qwen_vl_interface:     2.0e-5         # backbone (UamVLA's backbone_lr equivalent)
    state_encoder:         1.0e-4
    # per-head LR is read from framework.aux_heads.{name}.lr by UamVLA.get_lr_groups()

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6

  freeze_modules: null                    # Phase 1 from-scratch — no freeze
  loss_scale:
    vla: 1.0                              # vlm not used (supports_training_tag returns False)

  max_grad_norm: 1.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 16
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8

  visualization:
    enabled: true
    train_every_n_steps: 1000
    num_samples: 1

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
