run_id: uamvla_oft_calvin_d
run_root_dir: playground/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_project: uamvla
wandb_entity: tancilon1-fudan-university-school-of-management
is_debug: false
version_id: "0.1"

# framework: model construction
framework:
  name: UamVLAOFT
  qwenvl:
    base_vlm: ckpt/Qwen3-VL-8B-Instruct
    attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
  action_model:
    action_model_type: MLP
    action_dim: 7
    action_hidden_dim: 4096
    action_horizon: 5
    future_action_window_size: 4
    past_action_window_size: 0
  obs_image_size: [640, 640]
  vae:
    path: ckpt/pretrained_vae
  aux_heads:
    pose:
      enabled: false
      loss_weight: 0.5
      pose_mode: rot_matrix
      sde_mode: ve
      num_queries: 4
      semantic_dim: 512
      sampling_steps: 500
    future:
      enabled: false
      loss_weight: 1.0
      view_idx: 0
      target_resize: 320
      denoiser_depth: 3
      denoiser_embed_dim: 1024
      repeat_factor: 4
    recon:
      enabled: true
      loss_weight: 1.0
      view_idx: 0
      target_resize: 320
      denoiser_depth: 3
      denoiser_embed_dim: 1024
      repeat_factor: 4

# datasets: CALVIN D-only LeRobot dataset
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: datasets/calvin2uam
    data_mix: uamvla_calvin_d
    action_type: delta_qpos
    per_device_batch_size: 1
    obs: ["video.primary_image", "video.wrist_image"]
    include_state: true
    image_resize: 640
    aux_state_slice:
      target_pose_rot6d: [15, 21]
      target_pose_trans: [21, 24]
      static_cam_rot6d:  [24, 30]
      static_cam_trans:  [30, 33]

# trainer: optimization / logging
trainer:
  # D-only has 304,294 frames. With 4 GPUs, per_device_batch_size=1 and
  # GRAD_ACCUM=8, effective batch is 32, so 50k optimizer steps is about
  # 5.3 passes over the dataset.
  epochs: 5
  max_train_steps: 50000
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 1000
  visualization:
    enabled: true
    train_every_n_steps: 1000
    num_samples: 1

  learning_rate:
    base:               1.0e-4
    qwen_vl_interface:  1.0e-5
    action_model:       1.0e-4

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6

  freeze_modules: null
  max_grad_norm: 1.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
